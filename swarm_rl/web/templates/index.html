<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrotor Swarm Three.js</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container">
        <div id="info-panel">
            <h2 style="margin-bottom: 0; text-align: center;">Quadrotor Swarm</h2>
            <div style="color: #666; font-size: 0.9em; margin-bottom: 15px; text-align: center;">powered by Three.js</div>
            <div id="connection-status">
                <span id="status-indicator" class="disconnected"></span>
                <span id="status-text">Disconnected</span>
            </div>
            <div id="stats">
                <div>Episode: <span id="episode">0</span></div>
                <div>Step: <span id="step">0</span></div>
                <div>Active Drones: <span id="drone-count">0</span></div>
            </div>
            <div id="controls">
                <button id="toggle-trails-btn">Toggle Trails</button>
            </div>
            <div id="camera-info" style="margin-top: 20px;">
                <div style="font-weight: bold; font-size: 14px; margin-bottom: 12px;">Camera Controls:</div>
                <div style="margin-bottom: 5px;"><span style="font-weight: bold;">Mouse wheel:</span> Zoom in/out</div>
                <div style="margin-bottom: 5px;"><span style="font-weight: bold;">Left click + drag:</span> Rotate 360°</div>
                <div style="margin-bottom: 5px;"><span style="font-weight: bold;">Ctrl + Z + drag/wheel:</span> Free movement</div>
            </div>

        </div>
        <div id="canvas-container">
            <canvas id="three-canvas"></canvas>
        </div>
    </div>

    <script src="js/visualizer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
